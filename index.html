<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shahd & Abdallah</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f3ed;
  color: #332b27;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

/* FIRST SCREEN */
.cover {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 20px;
}

.names {
  font-family: "Brush Script MT", cursive;
  font-size: 48px;
  margin-bottom: 10px;
}

.intro {
  font-size: 15px;
  font-style: italic;
  letter-spacing: 1px;
  margin-bottom: 45px;
}

/* ENVELOPE */
.envelope {
  position: relative;
  width: 330px;
  height: 220px;
  cursor: pointer;
  margin: 0 auto;
}

.envelope-back {
  position: absolute;
  inset: 0;
  background: #e8dfd5;
  box-shadow: 0 15px 35px rgba(0,0,0,.15);
  border: 1px solid #d5c9bd;
}

/* LETTER */
.letter {
  position: absolute;
  left: 20px;
  bottom: 15px;
  width: 290px;
  height: 175px;
  background: #fffdf9;
  z-index: 2;
  padding: 25px 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
  transition: 1.2s ease;
}

.letter h2 {
  font-family: "Brush Script MT", cursive;
  font-size: 34px;
  margin: 15px 0 5px;
}

.letter p {
  font-size: 13px;
  letter-spacing: 2px;
}

/* FLAP */
.flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;

  border-left: 165px solid transparent;
  border-right: 165px solid transparent;
  border-top: 120px solid #ded4ca;

  transform-origin: top center;
  transition: 1s ease;
  z-index: 4;
}

/* SEAL */
.seal {
  position: absolute;
  left: 50%;
  top: 95px;
  transform: translateX(-50%);
  width: 58px;
  height: 58px;
  border-radius: 50%;

  background: #d2bca7;
  border: 3px solid #bda58f;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;
  font-size: 24px;

  z-index: 6;
  transition: .5s ease;
}

/* OPEN ANIMATION */
.envelope.open .flap {
  transform: rotateX(180deg);
}

.envelope.open .seal {
  opacity: 0;
}

.envelope.open .letter {
  transform: translateY(-125px);
}

/* INVITATION CONTENT */
.invitation {
  display: none;
  text-align: center;
  padding: 80px 25px;
  min-height: 100vh;
  animation: appear 1.5s ease forwards;
}

.envelope.open + .invitation {
  display: block;
}

.invitation h2 {
  font-family: "Brush Script MT", cursive;
  font-size: 50px;
  font-weight: normal;
}

.invitation p {
  font-size: 17px;
  line-height: 1.8;
}

.divider {
  width: 80px;
  height: 1px;
  background: #bca99a;
  margin: 30px auto;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(40px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<section class="cover">

  <div class="names">
    Shahd & Abdallah
  </div>

  <div class="intro">
    Joyfully invite you to celebrate their wedding
  </div>

  <div class="envelope"
       onclick="this.classList.toggle('open')">

    <div class="envelope-back"></div>

    <div class="letter">
      <h2>Shahd & Abdallah</h2>
      <p>OUR WEDDING</p>
    </div>

    <div class="flap"></div>

    <div class="seal">
      ♥
    </div>

  </div>

  <div class="invitation">

    <h2>You're Invited</h2>

    <div class="divider"></div>

    <p>
      Together with their families,<br>
      Shahd & Abdallah<br>
      invite you to celebrate their special day.
    </p>

    <div class="divider"></div>

    <p>
      Wedding details coming soon
    </p>

  </div>

</section>

</body>
</html>
