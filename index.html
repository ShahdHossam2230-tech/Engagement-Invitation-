<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shahd & Abdallah</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f8f1ec;
      color: #594b48;
      font-family: "Cormorant Garamond", serif;
      overflow-x: hidden;
    }

    /* =========================
       OPENING SCREEN
    ========================= */

    .opening {
      position: fixed;
      inset: 0;
      z-index: 100;
      background:
        radial-gradient(circle at top, #fffaf7 0%, #f8eee9 55%, #f1e2dd 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    .opening.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .opening-content {
      width: 90%;
      max-width: 430px;
      text-align: center;
    }

    .small-text {
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .opening-names {
      font-family: "Great Vibes", cursive;
      font-size: 55px;
      font-weight: 400;
      color: #725d58;
      margin: 0 0 12px;
    }

    .opening-subtitle {
      font-size: 18px;
      font-style: italic;
      margin-bottom: 42px;
    }

    /* Envelope */

    .envelope {
      position: relative;
      width: 320px;
      height: 215px;
      margin: auto;
      cursor: pointer;
      perspective: 1000px;
    }

    .envelope-body {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 175px;
      background: #eee1dc;
      border: 1px solid #ddcdc7;
      box-shadow: 0 18px 35px rgba(91, 69, 62, 0.18);
      overflow: hidden;
    }

    .envelope-body::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-bottom: 90px solid #e4d4ce;
    }

    .envelope-body::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-bottom: 90px solid #e9dad5;
    }

    .letter {
      position: absolute;
      z-index: 2;
      left: 25px;
      bottom: 12px;
      width: 270px;
      height: 175px;
      background: #fffdfa;
      box-shadow: 0 8px 20px rgba(70, 50, 45, .12);
      padding: 25px 10px;
      transition: transform 1.3s cubic-bezier(.2,.7,.2,1);
    }

    .letter-title {
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      color: #725d58;
    }

    .letter-line {
      width: 55px;
      height: 1px;
      background: #c9a9a0;
      margin: 12px auto;
    }

    .letter-text {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
