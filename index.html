<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shahd & Abdallah</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f1eb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      color: #2d2926;
    }

    .invitation {
      text-align: center;
      width: 100%;
      max-width: 500px;
      padding: 40px 20px;
    }

    h1 {
      font-family: "Brush Script MT", cursive;
      font-size: 48px;
      font-weight: normal;
      margin: 0 0 15px;
    }

    .subtitle {
      font-size: 17px;
      font-style: italic;
      margin-bottom: 45px;
    }

    .envelope {
      position: relative;
      width: 320px;
      height: 210px;
      margin: auto;
      cursor: pointer;
      perspective: 800px;
    }

    .envelope-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 170px;
      background: #eee9e2;
      border: 1px solid #d8d0c7;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 105px solid #e5ded5;
      transform-origin: top;
      transition: transform 1s ease;
      z-index: 3;
    }

    .seal {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #ded3c7;
      border: 3px solid #c9bbae;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      z-index: 5;
      transition: opacity .5s ease;
    }

    .letter {
      position: absolute;
      left: 25px;
      bottom: 20px;
      width: 270px;
      height: 145px;
      background: #fffdf9;
      padding: 20px;
      transition: transform 1s ease;
      z-index: 1;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .letter h2 {
      margin: 5px 0;
      font-family: "Brush Script MT", cursive;
      font-size: 28px;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
    }

    .envelope.open .seal {
      opacity: 0;
    }

    .envelope.open .letter {
      transform: translateY(-100px);
      z-index: 4;
    }

    .details {
      display: none;
      margin-top: 80px;
      animation: fadeIn 1.5s ease;
    }

    .envelope.open + .details {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="invitation">

    <h1>Shah
